apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meditriage-dev
resources:
  - ../../base
images:
  - name: ghcr.io/djat03/meditrriage-api
    newTag: v1
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: meditrriage-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
