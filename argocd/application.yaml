apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: meditriage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DJAT03/equipo-a-gitops.git
    targetRevision: main
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: meditriage-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
